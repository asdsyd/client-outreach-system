<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Unsubscribe from outreach</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f3f7f5;
        color: #17352b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 520px);
        padding: 40px;
        border: 1px solid #d8e5df;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 18px 60px rgba(23, 53, 43, 0.1);
      }
      .eyebrow {
        margin: 0 0 12px;
        color: #28735a;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(28px, 7vw, 40px);
        line-height: 1.08;
        letter-spacing: -0.04em;
      }
      p {
        margin: 18px 0 0;
        color: #49665c;
        font-size: 17px;
        line-height: 1.6;
      }
      form {
        margin-top: 28px;
      }
      button {
        width: 100%;
        min-height: 52px;
        border: 0;
        border-radius: 14px;
        background: #176a4e;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }
      button:hover {
        background: #12583f;
      }
      button:focus-visible {
        outline: 3px solid #7fc7ac;
        outline-offset: 3px;
      }
      .note {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Nunoon outreach</p>
      <h1>Stop future outreach emails?</h1>
      <p>
        Confirm below and this address will be added to our permanent outreach
        suppression list.
      </p>
      <form
        method="post"
        action="https://n8n.example.com/webhook/nunoon-outreach-unsubscribe?token=__TOKEN__"
      >
        <input type="hidden" name="token" value="__TOKEN__" />
        <input type="hidden" name="List-Unsubscribe" value="One-Click" />
        <button type="submit">Unsubscribe</button>
      </form>
      <p class="note">No sign-in is required.</p>
    </main>
  </body>
</html>
