<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Unsubscribed</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f3f7f5;
        color: #17352b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 520px);
        padding: 40px;
        border: 1px solid #d8e5df;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 18px 60px rgba(23, 53, 43, 0.1);
      }
      .check {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #dff3e9;
        color: #176a4e;
        font-size: 28px;
        font-weight: 800;
      }
      h1 {
        margin: 24px 0 0;
        font-size: clamp(28px, 7vw, 40px);
        line-height: 1.08;
        letter-spacing: -0.04em;
      }
      p {
        margin: 18px 0 0;
        color: #49665c;
        font-size: 17px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="check" aria-hidden="true">✓</div>
      <h1>You’re unsubscribed.</h1>
      <p>
        This address will not receive future Nunoon outreach emails. You can
        close this page.
      </p>
    </main>
  </body>
</html>
